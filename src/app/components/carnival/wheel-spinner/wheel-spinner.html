<div class="flex flex-col items-center justify-center p-8 bg-carnival-purple/50 rounded-2xl glass-panel relative overflow-hidden">
    
  <!-- Wheel Container -->
  <div class="relative w-80 h-80 wheel-animation" 
       [style.transform]="'rotate(' + rotationDegree + 'deg)'">

    
    <!-- Segments -->
    <div class="absolute inset-0 rounded-full border-8 border-carnival-gold shadow-[0_0_50px_rgba(251,191,36,0.3)] overflow-hidden bg-white">
      <svg viewBox="0 0 100 100" class="w-full h-full transform -rotate-90">
        <!-- Loop for segments and text -->
        <g *ngFor="let p of prizes; let i = index">
          <path [attr.d]="'M50 50 L' + (50 + 50 * mathCos(i * 45)) + ' ' + (50 + 50 * mathSin(i * 45)) + ' A50 50 0 0 1 ' + (50 + 50 * mathCos((i + 1) * 45)) + ' ' + (50 + 50 * mathSin((i + 1) * 45)) + ' Z'" 
                [attr.fill]="p.color"
                class="stroke-white/10 stroke-1" />
          
          <!-- Text Labels -->
          <text [attr.x]="50 + 35 * mathCos(i * 45 + 22.5)" 
                [attr.y]="50 + 35 * mathSin(i * 45 + 22.5)" 
                fill="white" 
                font-size="4" 
                font-weight="bold"
                text-anchor="middle"
                [attr.transform]="'rotate(' + (i * 45 + 22.5 + 90) + ', ' + (50 + 35 * mathCos(i * 45 + 22.5)) + ', ' + (50 + 35 * mathSin(i * 45 + 22.5)) + ')'"
                class="pointer-events-none drop-shadow-md">
            {{p.name}}
          </text>
        </g>
      </svg>
    </div>

    <!-- Center Hub -->
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-white rounded-full border-4 border-carnival-gold z-10 flex items-center justify-center shadow-2xl">
      <div class="w-10 h-10 rounded-full bg-gradient-to-br from-carnival-pink to-purple-600 animate-pulse shadow-inner"></div>
    </div>
  </div>

  <!-- Pointer Indicator -->
  <div class="absolute top-6 left-1/2 transform -translate-x-1/2 z-20">
    <div class="w-8 h-10 bg-white shadow-[0_4px_10px_rgba(0,0,0,0.5)] flex items-center justify-center" style="clip-path: polygon(100% 0, 0 0, 50% 100%);">
        <div class="w-4 h-6 bg-carnival-gold mb-2" style="clip-path: polygon(100% 0, 0 0, 50% 100%);"></div>
    </div>
  </div>

  <!-- Result Display -->
  <div class="mt-10 text-center space-y-6 relative z-10 w-full">
    <div *ngIf="!prize && !isSpinning">
        <h3 class="text-2xl font-display font-bold text-white mb-2">Feeling Lucky?</h3>
        <p class="text-white/60 text-sm max-w-xs mx-auto">Spin to win exclusive merch and scholarships!</p>
    </div>

    <div *ngIf="isSpinning" class="flex flex-col items-center gap-2">
        <div class="flex gap-1">
            <div class="w-2 h-2 bg-carnival-pink rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
            <div class="w-2 h-2 bg-carnival-gold rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
        </div>
        <span class="text-white font-semibold">Spinning for prizes...</span>
    </div>
    
    <div *ngIf="prize && !isSpinning" class="animate-fade-in-up">
      <div class="inline-block py-3 px-8 bg-gradient-to-r from-carnival-gold via-white to-carnival-gold bg-clip-text text-transparent font-black text-3xl mb-2">
        WINNER!
      </div>
      <div class="py-4 px-6 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-2xl">
        <span class="text-carnival-pink text-sm uppercase font-bold tracking-widest block mb-1">You unlocked</span>
        <h4 class="text-white text-2xl font-bold">{{ prize }}</h4>
      </div>
    </div>

    <button (click)="spinWheel()" [disabled]="isSpinning" 
      class="group relative w-full py-4 bg-gradient-to-r from-carnival-pink via-purple-600 to-carnival-pink bg-[length:200%_auto] hover:bg-right text-white font-bold rounded-2xl shadow-[0_10px_20px_rgba(236,72,153,0.3)] hover:shadow-[0_15px_30px_rgba(236,72,153,0.5)] transform hover:-translate-y-1 active:scale-95 transition-all duration-300 disabled:opacity-50 disabled:translate-y-0 disabled:shadow-none">
      <span class="relative z-10">{{ isSpinning ? 'SPINNING...' : 'SPIN THE WHEEL' }}</span>
      <div class="absolute inset-0 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-white/10"></div>
    </button>
  </div>
</div>
