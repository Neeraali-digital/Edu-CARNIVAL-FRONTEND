<div class="page-header">
  <div class="header-left">
    <h2>Program Schedule</h2>
    <span class="text-gray-500">{{ programs.length }} Events</span>
  </div>
  <button class="primary-btn" (click)="openModal()">+ Add Event</button>
</div>

<div class="table-container">
  <table class="data-table">
    <thead>
      <tr>
        <th width="20%">City</th>
        <th width="15%">Time</th>
        <th width="25%">Title</th>
        <th width="30%">Description</th>
        <th width="10%">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of programs">
        <td><span class="font-bold text-carnival-purple">{{ item.city_details?.name || 'Unknown' }}</span></td>
        <td>{{ item.time }}</td>
        <td>{{ item.title }}</td>
        <td>{{ item.description }}</td>
        <td>
           <button class="action-btn delete" (click)="deleteProgram(item.id)" title="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
           </button>
        </td>
      </tr>
      <tr *ngIf="programs.length === 0">
        <td colspan="5" class="text-center py-8 text-gray-400">No program events added yet.</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div *ngIf="showModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3 class="text-xl font-bold">Add Program Event</h3>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
    </div>
    <form #programForm="ngForm" (ngSubmit)="saveProgram()">
      <div class="modal-body">
        
        <div class="form-group">
          <label>Select City</label>
          <select [(ngModel)]="newItem.city" name="city" required class="bg-gray-50 text-gray-900 bg-white">
            <option value="" disabled selected>Choose a city</option>
            <option *ngFor="let city of cities" [value]="city.id" class="text-gray-900">{{ city.name }}</option>
          </select>
        </div>

        <div class="form-group">
            <label>Time</label>
            <input type="text" [(ngModel)]="newItem.time" name="time" required placeholder="e.g. 10:00 AM" class="text-gray-900 bg-white">
        </div>

        <div class="form-group">
            <label>Title</label>
            <input type="text" [(ngModel)]="newItem.title" name="title" required placeholder="e.g. Opening Ceremony" class="text-gray-900 bg-white">
        </div>
        
        <div class="form-group">
            <label>Description</label>
            <textarea [(ngModel)]="newItem.description" name="description" rows="3" required placeholder="Brief details..." class="text-gray-900 bg-white"></textarea>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-save" [disabled]="!programForm.valid || isSubmitting">
            {{ isSubmitting ? 'Saving...' : 'Add Event' }}
        </button>
      </div>
    </form>
  </div>
</div>
