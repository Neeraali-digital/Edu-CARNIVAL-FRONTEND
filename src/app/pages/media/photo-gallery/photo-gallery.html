<div class="pt-24 min-h-screen bg-[#1a0b2e] pb-20 lg:px-16">
  <div class="container mx-auto px-4">
    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-6xl font-display font-bold text-white mb-4">Photo <span class="text-carnival-pink">Gallery</span></h1>
      <p class="text-white/60">Relive the moments from our past carnivals.</p>
    </div>

    <!-- Grouped Gallery Sections -->
    <div *ngIf="isLoading" class="animate-pulse space-y-12">
        <!-- Skeleton Group -->
        <div class="bg-white/5 rounded-3xl p-8 border border-white/10 backdrop-blur-sm">
            <div class="flex items-center gap-4 mb-8">
                <div class="h-10 w-32 bg-white/10 rounded-lg"></div>
                <div class="h-px flex-grow bg-white/10"></div>
            </div>
            <div class="columns-2 md:columns-2 lg:columns-3 gap-4 md:gap-6 space-y-4 md:space-y-6">
                <div class="break-inside-avoid">
                    <div class="w-full h-64 bg-white/10 rounded-2xl"></div>
                </div>
                <div class="break-inside-avoid">
                    <div class="w-full h-80 bg-white/10 rounded-2xl"></div>
                </div>
                <div class="break-inside-avoid">
                    <div class="w-full h-56 bg-white/10 rounded-2xl"></div>
                </div>
                 <div class="break-inside-avoid">
                    <div class="w-full h-72 bg-white/10 rounded-2xl"></div>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="!isLoading">
      <div *ngFor="let group of groupedPhotos" class="mb-12 bg-white/5 rounded-3xl p-8 border border-white/10 backdrop-blur-sm">
      
      <!-- Year Header -->
      <div class="flex items-center gap-4 mb-8">
        <h2 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-carnival-pink to-purple-400 flex items-baseline gap-3">
          {{ group.year }} <span class="text-lg md:text-xl text-white/50 font-normal">@ {{ group.headerTitle }}</span>
        </h2>
        <div class="h-px flex-grow bg-gradient-to-r from-white/30 to-transparent"></div>
      </div>

      <!-- Photos Grid -->
      <div class="columns-2 md:columns-2 lg:columns-3 gap-4 md:gap-6 space-y-4 md:space-y-6">
        <div *ngFor="let photo of group.photos" 
             (click)="openFullscreen(photo)"
             class="group relative rounded-2xl overflow-hidden break-inside-avoid cursor-zoom-in border border-white/10 active:scale-[1.02] transition-transform duration-300 bg-white/5">
          <div class="relative overflow-hidden rounded-xl min-h-[200px] md:min-h-[260px] bg-gradient-to-br from-white/5 via-purple-950/40 to-black">
            
            <!-- Image Skeleton Loader overlay -->
            <div *ngIf="!isLoaded(photo.id)" 
                 class="absolute inset-0 z-20 bg-gradient-to-br from-purple-950 via-[#180a2e] to-black animate-pulse flex flex-col items-center justify-center p-4">
              <div class="w-10 h-10 rounded-full bg-carnival-pink/20 border border-carnival-pink/40 flex items-center justify-center mb-2">
                <svg class="w-5 h-5 text-carnival-pink animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </div>
            </div>

            <img [src]="photo.image" 
                 loading="lazy" 
                 (load)="onImageLoad(photo.id)"
                 [ngClass]="isLoaded(photo.id) ? 'opacity-100 scale-100' : 'opacity-0 scale-95'"
                 class="w-full h-auto transform transition-all duration-700 ease-out group-hover:scale-110 block" 
                 [alt]="photo.title">
            
            <!-- Hover overlay -->
            <div class="absolute inset-0 z-10 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center p-4 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white mb-2 transform group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
                </svg>
                <p class="text-white font-bold text-sm md:text-base leading-snug">{{ photo.title }}</p>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Empty State -->
    <div *ngIf="groupedPhotos.length === 0" class="text-center py-20">
      <p class="text-white/40 text-xl">No photos available yet.</p>
    </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div *ngIf="selectedPhoto" 
       class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex flex-col items-center justify-center p-4 md:p-10 animate-fade-in"
       (click)="closeFullscreen()">
    
    <!-- Close Button -->
    <button (click)="closeFullscreen()" class="absolute top-6 right-6 text-white/50 hover:text-white transition-colors z-[110]">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Image Container -->
    <div class="relative max-w-5xl w-full max-h-[85vh] flex items-center justify-center group" (click)="$event.stopPropagation()">
      <img [src]="selectedPhoto.image" 
           class="max-w-full max-h-full object-contain rounded-lg shadow-2xl animate-zoom-in" 
           [alt]="selectedPhoto.title">
      
      <!-- Label Overlay -->
      <div class="absolute bottom-[-50px] left-0 right-0 text-center">
        <p class="text-carnival-gold text-sm uppercase tracking-widest font-bold mb-1">{{ selectedPhoto.year }}</p>
        <h3 class="text-white text-xl font-display font-bold">{{ selectedPhoto.title }}</h3>
      </div>
    </div>

  </div>
</div>
