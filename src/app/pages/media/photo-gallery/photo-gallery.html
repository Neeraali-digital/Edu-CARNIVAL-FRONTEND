<div class="pt-24 min-h-screen bg-[#1a0b2e] pb-20">
  <div class="container mx-auto px-4">
    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-6xl font-display font-bold text-white mb-4">Photo <span class="text-carnival-pink">Gallery</span></h1>
      <p class="text-white/60">Relive the moments from our past carnivals.</p>
    </div>

    <!-- Gallery Grid (Masonry-ish) -->
    <div class="columns-1 md:columns-2 lg:columns-3 gap-6 space-y-6">
      
      <!-- Dynamic Photo Items -->
      <div *ngFor="let photo of photos" class="group relative rounded-2xl overflow-hidden break-inside-avoid cursor-zoom-in">
        <img [src]="photo.image" class="w-full h-auto transform transition-transform duration-700 group-hover:scale-110" [alt]="photo.title">
        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center p-4 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
            </svg>
            <p class="text-white font-bold">{{ photo.title }}</p>
        </div>
      </div>

    </div>
  </div>
</div>
