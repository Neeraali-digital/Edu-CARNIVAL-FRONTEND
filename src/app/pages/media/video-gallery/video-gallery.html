<div class="pt-24 min-h-screen bg-[#1a0b2e] pb-20">
  <div class="container mx-auto px-4">
    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-6xl font-display font-bold text-white mb-4">Video <span class="text-carnival-gold">Gallery</span></h1>
      <p class="text-white/60">Watch highlights, interviews, and performances.</p>
    </div>

    <!-- Video Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      
       <!-- Dynamic Video Items -->
       <div *ngFor="let video of videos" class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden hover:border-carnival-gold/50 transition-colors group">
         <div class="relative h-48 bg-black">
           <iframe class="w-full h-full" [src]="video.video_url | safeUrl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
         </div>
         <div class="p-4">
           <h3 class="text-lg font-bold text-white mb-1 group-hover:text-carnival-gold transition-colors">{{ video.title }}</h3>
           <p class="text-white/50 text-xs">Video Content</p>
         </div>
       </div>

    </div>
  </div>
</div>
