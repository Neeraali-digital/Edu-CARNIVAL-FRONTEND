<div class="pt-24 min-h-screen bg-[#1a0b2e] pb-20">
  <div class="container mx-auto px-4">
    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-6xl font-display font-bold text-white mb-4">Virtual <span class="text-carnival-pink">Stalls</span></h1>
      <p class="text-white/60">Explore our digital exhibition hall. Click on a stall to interact.</p>
    </div>

    <!-- Filter/Search Bar -->
    <div class="mb-12 flex flex-col md:flex-row gap-4 justify-center">
      <input type="text" placeholder="Search for universities..." class="px-6 py-3 rounded-full bg-white/5 border border-white/10 text-white focus:outline-none focus:border-carnival-pink w-full md:w-96 backdrop-blur-sm">
      <div class="flex gap-2 justify-center">
        <button class="px-6 py-3 rounded-full bg-carnival-pink text-white font-bold hover:bg-carnival-pink/80 transition-colors">All</button>
        <button class="px-6 py-3 rounded-full bg-white/5 text-white font-bold hover:bg-white/10 transition-colors">Engineering</button>
        <button class="px-6 py-3 rounded-full bg-white/5 text-white font-bold hover:bg-white/10 transition-colors">Medical</button>
      </div>
    </div>

    <!-- Stalls Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      
      <!-- Stall Card Loop -->
      <div *ngFor="let stall of [1,2,3,4,5,6]" class="group h-80 perspective w-full cursor-pointer">
        <div class="relative w-full h-full transition-transform duration-700 transform-style-3d group-hover:rotate-y-180">
          
          <!-- Front Side -->
          <div class="absolute inset-0 backface-hidden rounded-2xl overflow-hidden glass-panel border border-white/10">
            <div class="h-2/3 bg-cover bg-center" [style.backgroundImage]="'url(https://placehold.co/600x400/2e1065/white?text=University+' + stall + ')'"></div>
            <div class="h-1/3 bg-[#2e1065] p-4 flex flex-col justify-center items-center text-center">
              <h3 class="text-xl font-display font-bold text-white mb-1">University Name {{stall}}</h3>
              <p class="text-carnival-gold text-sm">Booth A-{{stall}}0</p>
            </div>
            <!-- Decorative Banner -->
            <div class="absolute top-4 right-4 bg-carnival-pink text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">
              PREMIUM
            </div>
          </div>

          <!-- Back Side -->
          <div class="absolute inset-0 backface-hidden rounded-2xl overflow-hidden bg-carnival-purple border border-carnival-pink p-6 rotate-y-180 flex flex-col items-center justify-center text-center space-y-4">
            <h3 class="text-2xl font-display font-bold text-white">University Name {{stall}}</h3>
            <p class="text-white/70 text-sm">Offering top-tier courses in Engineering, Arts, and Sciences. Scholarships available up to 50%.</p>
            
            <div class="flex gap-2">
               <button class="px-4 py-2 bg-white text-carnival-purple font-bold rounded-lg text-sm hover:bg-gray-100">Download Brochure</button>
               <button class="px-4 py-2 bg-carnival-gold text-carnival-purple font-bold rounded-lg text-sm hover:bg-yellow-400">Chat Now</button>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
