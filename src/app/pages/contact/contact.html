<div class="pt-24 min-h-screen bg-[#1a0b2e] pb-20">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
      
      <!-- Text Content -->
      <div class="space-y-8">
        <h1 class="text-4xl md:text-5xl font-display font-bold text-white leading-tight">
          Get in <span class="text-carnival-pink">Touch</span>
        </h1>
        <p class="text-white/60 text-lg">
          Have questions about the Edu Carnival? Whether you're a university looking to exhibit or a student needing guidance, we're here to help.
        </p>
        
        <div class="space-y-6 pt-4">
          <div class="flex items-center gap-4 text-white/80">
            <div class="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center text-carnival-gold">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
            </div>
            <div>
              <p class="text-xs text-white/40 uppercase tracking-wider">Call Us</p>
              <p class="font-medium">+91 98765 43210</p>
            </div>
          </div>
          
          <div class="flex items-center gap-4 text-white/80">
            <div class="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center text-carnival-gold">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
             <div>
              <p class="text-xs text-white/40 uppercase tracking-wider">Email Us</p>
              <p class="font-medium">hello@educarnival.com</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Form -->
      <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-8 shadow-xl">
        <form (ngSubmit)="onSubmit()" class="space-y-6">
           <div>
             <label class="block text-sm font-medium text-white/70 mb-2">Name</label>
             <input type="text" [(ngModel)]="formData.name" name="name" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-pink" required>
           </div>
           <div>
             <label class="block text-sm font-medium text-white/70 mb-2">Email</label>
             <input type="email" [(ngModel)]="formData.email" name="email" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-pink" required>
           </div>
           <div>
             <label class="block text-sm font-medium text-white/70 mb-2">Subject</label>
             <select [(ngModel)]="formData.subject" name="subject" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-pink">
               <option value="General Inquiry">General Inquiry</option>
               <option value="Exhibitor Support">Exhibitor Support</option>
               <option value="Sponsorship">Sponsorship</option>
             </select>
           </div>
           
           <div>
             <label class="block text-sm font-medium text-white/70 mb-2">Message</label>
             <textarea [(ngModel)]="formData.message" name="message" rows="4" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-pink placeholder-white/20" placeholder="How can we help you?" required></textarea>
           </div>
           
           <button type="submit" class="w-full py-4 bg-white text-carnival-purple font-bold rounded-lg shadow-lg hover:bg-carnival-gold transition-colors">
             Send Message
           </button>
        </form>
      </div>

    </div>
  </div>
</div>
