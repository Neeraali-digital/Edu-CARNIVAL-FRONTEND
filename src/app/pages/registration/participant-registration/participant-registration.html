<div class="pt-24 min-h-screen bg-[#1a0b2e] pb-20 relative overflow-hidden">
  
  <!-- Decorative elements -->
  <div class="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-carnival-pink/10 to-transparent pointer-events-none"></div>
  <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-carnival-gold/10 rounded-full blur-[80px] z-0 animate-pulse-slow"></div>

  <div class="container mx-auto px-4 relative z-10">
    <div class="max-w-3xl mx-auto">
      
      <div class="text-center mb-10">
        <h1 class="text-3xl md:text-5xl font-display font-bold text-white mb-3">Join the <span class="text-carnival-pink">Excitement</span></h1>
        <p class="text-white/60">Register now to get your free entry pass and exclusive carnival kit.</p>
      </div>

      <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-8 md:p-10 shadow-2xl relative overflow-hidden">
         <!-- Form Header Decoration -->
         <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-carnival-gold via-carnival-pink to-purple-600"></div>

         <form class="space-y-6">
           <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
             <!-- Name -->
             <div class="group relative">
               <input type="text" id="name" class="peer w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-pink transition-colors placeholder-transparent" placeholder="Full Name">
               <label for="name" class="absolute left-4 top-3 text-white/50 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-white/50 peer-placeholder-shown:top-3 peer-focus:-top-2.5 peer-focus:text-xs peer-focus:text-carnival-pink peer-focus:bg-[#201035] peer-focus:px-1 pointer-events-none">Full Name</label>
             </div>

             <!-- Email -->
             <div class="group relative">
               <input type="email" id="email" class="peer w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-pink transition-colors placeholder-transparent" placeholder="Email Address">
               <label for="email" class="absolute left-4 top-3 text-white/50 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-white/50 peer-placeholder-shown:top-3 peer-focus:-top-2.5 peer-focus:text-xs peer-focus:text-carnival-pink peer-focus:bg-[#201035] peer-focus:px-1 pointer-events-none">Email Address</label>
             </div>
           </div>

           <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- Phone -->
              <div class="group relative">
                <input type="tel" id="phone" class="peer w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-pink transition-colors placeholder-transparent" placeholder="Phone Number">
                <label for="phone" class="absolute left-4 top-3 text-white/50 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-white/50 peer-placeholder-shown:top-3 peer-focus:-top-2.5 peer-focus:text-xs peer-focus:text-carnival-pink peer-focus:bg-[#201035] peer-focus:px-1 pointer-events-none">Phone Number</label>
              </div>

              <!-- City Selection -->
              <div class="group relative">
                <select id="city" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-pink transition-colors appearance-none">
                  <option value="" disabled selected class="text-black">Select Nearest City</option>
                  <option value="Jammu" class="text-black">Jammu</option>
                  <option value="Gangtok" class="text-black">Gangtok</option>
                  <option value="Imphal" class="text-black">Imphal</option>
                  <option value="Dimapur" class="text-black">Dimapur</option>
                  <option value="Dibrugarh" class="text-black">Dibrugarh</option>
                  <option value="Guwahati" class="text-black">Guwahati</option>
                </select>
                <div class="absolute right-4 top-3.5 pointer-events-none text-white/50">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                  </svg>
                </div>
              </div>
           </div>

           <!-- Interest -->
           <div class="space-y-3">
             <span class="text-white/70 text-sm">I am interested in:</span>
             <div class="flex flex-wrap gap-3">
               <label class="cursor-pointer relative">
                 <input type="checkbox" class="peer sr-only">
                 <div class="px-4 py-2 rounded-full border border-white/20 text-white/70 text-sm peer-checked:bg-carnival-pink peer-checked:text-white peer-checked:border-carnival-pink hover:bg-white/5 transition-all">Engineering</div>
               </label>
               <label class="cursor-pointer relative">
                 <input type="checkbox" class="peer sr-only">
                 <div class="px-4 py-2 rounded-full border border-white/20 text-white/70 text-sm peer-checked:bg-carnival-pink peer-checked:text-white peer-checked:border-carnival-pink hover:bg-white/5 transition-all">Medical</div>
               </label>
               <label class="cursor-pointer relative">
                 <input type="checkbox" class="peer sr-only">
                 <div class="px-4 py-2 rounded-full border border-white/20 text-white/70 text-sm peer-checked:bg-carnival-pink peer-checked:text-white peer-checked:border-carnival-pink hover:bg-white/5 transition-all">Management</div>
               </label>
               <label class="cursor-pointer relative">
                 <input type="checkbox" class="peer sr-only">
                 <div class="px-4 py-2 rounded-full border border-white/20 text-white/70 text-sm peer-checked:bg-carnival-pink peer-checked:text-white peer-checked:border-carnival-pink hover:bg-white/5 transition-all">Arts & Design</div>
               </label>
             </div>
           </div>

           <button type="button" class="w-full py-4 bg-gradient-to-r from-carnival-pink to-purple-600 rounded-lg text-white font-bold text-lg shadow-lg hover:shadow-[0_0_20px_rgba(236,72,153,0.4)] transform hover:-translate-y-1 transition-all duration-300">
             Complete Registration
           </button>
           
           <p class="text-center text-white/40 text-xs mt-4">By registering, you agree to our Terms & Conditions and Privacy Policy.</p>
         </form>
      </div>

    </div>
  </div>
</div>
