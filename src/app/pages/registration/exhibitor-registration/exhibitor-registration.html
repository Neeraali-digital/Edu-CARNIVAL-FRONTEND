<div class="pt-24 min-h-screen bg-[#1a0b2e] pb-20 relative">
  <div class="container mx-auto px-4 max-w-4xl">
    
    <div class="text-center mb-10">
        <h1 class="text-3xl md:text-5xl font-display font-bold text-white mb-3">Exhibitor <span class="text-carnival-gold">Registration</span></h1>
        <p class="text-white/60">Showcase your institution to thousands of students across the region.</p>
      </div>

    <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-8 md:p-10 shadow-2xl relative">
       <!-- Decoration -->
       <div class="absolute top-0 right-0 p-4 opacity-10">
         <svg xmlns="http://www.w3.org/2000/svg" class="h-32 w-32 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
       </div>

       <form class="space-y-6 relative z-10">
         <!-- Institution Details -->
         <div class="space-y-4">
           <h3 class="text-carnival-gold font-bold uppercase tracking-wider text-sm border-b border-white/10 pb-2">Institution Details</h3>
           <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
             <div>
               <label class="block text-white/70 text-sm mb-2">Institution Name</label>
               <input type="text" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-gold transition-colors">
             </div>
             <div>
               <label class="block text-white/70 text-sm mb-2">Website</label>
               <input type="url" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-gold transition-colors">
             </div>
           </div>
           <div>
             <label class="block text-white/70 text-sm mb-2">Address</label>
             <input type="text" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-gold transition-colors">
           </div>
         </div>

         <!-- Contact Person -->
         <div class="space-y-4 pt-4">
           <h3 class="text-carnival-gold font-bold uppercase tracking-wider text-sm border-b border-white/10 pb-2">Contact Person</h3>
           <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
             <div>
               <label class="block text-white/70 text-sm mb-2">Full Name</label>
               <input type="text" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-gold transition-colors">
             </div>
             <div>
                <label class="block text-white/70 text-sm mb-2">Designation</label>
               <input type="text" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-gold transition-colors">
             </div>
           </div>
           <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
             <div>
               <label class="block text-white/70 text-sm mb-2">Email</label>
               <input type="email" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-gold transition-colors">
             </div>
             <div>
                <label class="block text-white/70 text-sm mb-2">Phone</label>
               <input type="tel" class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-carnival-gold transition-colors">
             </div>
           </div>
         </div>


         <button type="button" class="w-full py-4 mt-8 bg-carnival-gold text-carnival-purple font-bold rounded-lg shadow-lg hover:shadow-[0_0_20px_rgba(251,191,36,0.4)] transform hover:-translate-y-1 transition-all duration-300">
             Proceed to Payment
         </button>
       </form>
    </div>
  </div>
</div>
